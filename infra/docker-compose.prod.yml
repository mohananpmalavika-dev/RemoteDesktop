x-runtime: &runtime
  NODE_ENV: production
  DATABASE_URL: postgresql://krypton:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/krypton_remote
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
  API_PUBLIC_URL: https://${KRYPTON_DOMAIN:?Set KRYPTON_DOMAIN}
  SIGNALING_PUBLIC_URL: wss://${KRYPTON_DOMAIN:?Set KRYPTON_DOMAIN}/signaling
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
  DEVICE_ENROLLMENT_SIGNING_KEY: ${DEVICE_ENROLLMENT_SIGNING_KEY:?Set DEVICE_ENROLLMENT_SIGNING_KEY}
  TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
  TURN_REALM: ${KRYPTON_DOMAIN:?Set KRYPTON_DOMAIN}
  STUN_URLS: stun:${PUBLIC_IP:?Set PUBLIC_IP}:3478
  TURN_URLS: turn:${PUBLIC_IP:?Set PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP:?Set PUBLIC_IP}:3478?transport=tcp
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: 'true'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krypton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: krypton_remote
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U krypton -d krypton_remote']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: '..', dockerfile: infra/Dockerfile.api, target: migrations}
    environment: *runtime
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  api:
    build: {context: '..', dockerfile: infra/Dockerfile.api}
    restart: unless-stopped
    environment: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:4000/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
    init: true

  signaling:
    build: {context: '..', dockerfile: infra/Dockerfile.signaling}
    restart: unless-stopped
    environment: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:4001/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
    init: true

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET}
      - --realm=${KRYPTON_DOMAIN:?Set KRYPTON_DOMAIN}
      - --external-ip=${PUBLIC_IP:?Set PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49250
      - --no-tls
      - --no-dtls
      - --no-loopback-peers
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
    ports: ['3478:3478/udp', '3478:3478/tcp', '49152-49250:49152-49250/udp']

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      KRYPTON_DOMAIN: ${KRYPTON_DOMAIN:?Set KRYPTON_DOMAIN}
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    ports: ['80:80', '443:443', '443:443/udp']
    depends_on:
      api: {condition: service_healthy}
      signaling: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
