version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: krypton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krypton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krypton_secure_prod_password_2026}
      POSTGRES_DB: krypton_remote
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krypton -d krypton_remote"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - krypton-net

  redis:
    image: redis:7-alpine
    container_name: krypton-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - krypton-net

  coturn:
    image: coturn/coturn:latest
    container_name: krypton-coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49250:49152-49250/udp"
    command: ["-c", "/etc/turnserver.conf"]
    networks:
      - krypton-net

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: krypton-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://krypton:${POSTGRES_PASSWORD:-krypton_secure_prod_password_2026}@postgres:5432/krypton_remote
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://35.244.54.249:4000}
      SIGNALING_PUBLIC_URL: ${SIGNALING_PUBLIC_URL:-ws://35.244.54.249:4001}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-krypton_prod_jwt_access_secret_min_32_chars_long_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-krypton_prod_jwt_refresh_secret_min_32_chars_long_2026}
      DEVICE_ENROLLMENT_SIGNING_KEY: ${DEVICE_ENROLLMENT_SIGNING_KEY:-krypton_device_enrollment_signing_key_32_chars}
      TURN_SECRET: ${TURN_SECRET:-krypton_production_turn_secret_min_16_chars}
      TURN_REALM: kryptonremote.net
      STUN_URLS: ${STUN_URLS:-stun:35.244.54.249:3478}
      TURN_URLS: ${TURN_URLS:-turn:35.244.54.249:3478?transport=udp,turn:35.244.54.249:3478?transport=tcp}
    ports:
      - "4000:4000"
    networks:
      - krypton-net

  signaling:
    build:
      context: ..
      dockerfile: infra/Dockerfile.signaling
    container_name: krypton-signaling
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://krypton:${POSTGRES_PASSWORD:-krypton_secure_prod_password_2026}@postgres:5432/krypton_remote
      REDIS_URL: redis://redis:6379
      SIGNALING_PORT: 4001
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://35.244.54.249:4000}
      SIGNALING_PUBLIC_URL: ${SIGNALING_PUBLIC_URL:-ws://35.244.54.249:4001}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-krypton_prod_jwt_access_secret_min_32_chars_long_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-krypton_prod_jwt_refresh_secret_min_32_chars_long_2026}
      DEVICE_ENROLLMENT_SIGNING_KEY: ${DEVICE_ENROLLMENT_SIGNING_KEY:-krypton_device_enrollment_signing_key_32_chars}
      TURN_SECRET: ${TURN_SECRET:-krypton_production_turn_secret_min_16_chars}
    ports:
      - "4001:4001"
    networks:
      - krypton-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  krypton-net:
    driver: bridge
