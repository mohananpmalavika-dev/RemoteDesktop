# Coturn TURN Server Configuration for KryptonRemote
listening-port=3478
tls-listening-port=5349
realm=kryptonremote.net

# Authentication: long-term shared secret mechanism (RFC 5766 / RFC 8489)
use-auth-secret
static-auth-secret=dev_turn_shared_secret_min_16_chars

# Ports allocation for relay sessions
min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint
lt-cred-mech

# Do not allow loopback or private ranges as relay destinations
no-loopback-peers
no-multicast-peers

# Keep stale allocations clean
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
