[package]
name = "krypton-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
webrtc = "0.21.0"
rtc = "0.21.0"
local-ip-address = "0.6.13"
