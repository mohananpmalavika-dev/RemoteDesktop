[package]
name = "krypton-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# windows-sys supports both msvc and gnu toolchains.
# D3D11/DXGI is loaded dynamically via LoadLibraryW/GetProcAddress;
# only Foundation, GDI, and LibraryLoader are needed as static imports.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",  # for MONITORINFOF_PRIMARY
] }

[dev-dependencies]
env_logger = "0.11"
